server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/care?connectionTimeZone=UTC
    username: care
    password: ${CARE_DB_PASSWORD}
  rabbitmq:
    username: care
    password: ${CARE_RABBITMQ_PASSWORD}
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

notification:
  agents-mailbox: agents@melita.example
  from: order-platform@melita.example
