server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_intake?connectionTimeZone=UTC
    username: order_intake
    password: ${ORDER_INTAKE_DB_PASSWORD}
  rabbitmq:
    username: order-intake
    password: ${ORDER_INTAKE_RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: order-intake-api

installation:
  min-lead-working-days: 2
  max-horizon-days: 60
  excluded-days: [SUNDAY]
  # Maltese public holidays; installations are not booked on these days.
  public-holidays:
    - 2026-01-01
    - 2026-02-10
    - 2026-03-19
    - 2026-03-31
    - 2026-04-03
    - 2026-05-01
    - 2026-06-07
    - 2026-06-29
    - 2026-08-15
    - 2026-09-08
    - 2026-09-21
    - 2026-12-08
    - 2026-12-13
    - 2026-12-25
    - 2027-01-01
