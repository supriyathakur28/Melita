# Tests run without the Config Server; this file replaces src/main/resources/application.yml.
spring:
  application:
    name: order-approval-service
  cloud:
    config:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/melita
          jwk-set-uri: http://localhost:1/certs
          audiences: order-approval-api
      client:
        registration:
          fulfilment:
            client-id: order-approval
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: fulfilment:submit
        provider:
          fulfilment:
            token-uri: http://localhost:1/token

approval:
  required-packages: [MOBILE_POSTPAID, INTERNET_1GBPS]
  required-products: []

fulfilment:
  base-url: http://localhost:1
  max-attempts: 3
  initial-retry-delay: 100ms
  max-retry-delay: 200ms
  circuit-open-duration: 300ms
  submitter:
    interval-ms: 200

outbox:
  relay:
    interval-ms: 100

messaging:
  listener:
    retry:
      max-retries: 1
      initial-delay: 100ms
      max-delay: 200ms

pii:
  # Test-only key.
  encryption-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
